name: security

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: install govulncheck
        # Pinned: govulncheck >= ~v1.2 panics during symbol analysis on
        # generic code pulled in via charmbracelet/huh
        # ("ForEachElement called on type containing *types.TypeParam").
        # v1.1.4 runs the precise symbol scan cleanly. Revisit when the
        # upstream bug is fixed.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: run govulncheck
        run: govulncheck ./...
