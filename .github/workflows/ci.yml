name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: guard — .gitignore must not swallow source files
        # A 'name.*' pattern in .gitignore matches name.go too. This already bit
        # us once: 'coverage.*' (meant for coverage.out profiles) silently
        # ignored coverage.go SOURCE, so it never reached git and the package
        # shipped incomplete — invisible until something imported it. Catch the
        # whole class cheaply: reject any 'name.*' pattern.
        run: |
          if bad=$(grep -nE '^[^#].*[A-Za-z0-9]\.\*$' .gitignore); then
            echo "::error file=.gitignore::A 'name.*' pattern can swallow source files (e.g. 'coverage.*' matches coverage.go), which then never reaches git."
            echo "Offending .gitignore line(s):"
            echo "$bad"
            echo "Fix: ignore specific extensions instead — e.g. 'coverage.out' and 'coverage.html', not 'coverage.*'."
            exit 1
          fi
          echo "OK: no 'name.*' catch-all patterns in .gitignore"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: build without CGO
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/codefit
          GOOS=linux   GOARCH=arm64 go build -o /dev/null ./cmd/codefit
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/codefit

      - name: self-audit (codefit audits its own code)
        # MCP-first: there is no audit CLI. The dogfooding gate is a Go
        # integration test that runs the real security sensor + Go provider over
        # codefit's own source and fails on any unconsented critical finding.
        # Runs with CGO_ENABLED=0 — the mode codefit ships in. Race coverage of
        # this test already happens in the `go test -race ./...` step above.
        env:
          CGO_ENABLED: "0"
        run: go test -run TestSelfAudit ./internal/sensors/security/

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - uses: golangci/golangci-lint-action@v7
        with:
          # v7 installs golangci-lint v2 (the schema .golangci.yml uses).
          # Pinned to the version validated locally for reproducible CI.
          version: v2.12.2
