rules:
  # Hardcoded secret: a credential-named variable assigned a STATIC string
  # literal. The whole conclusion lives in one declarator subtree (the name and
  # the literal value), so this is a rule, not surface (ADR 0004).
  #
  # $VALUE must be a single- or double-quoted string: those are always static in
  # JS/TS. Backtick templates are intentionally excluded — `${process.env.X}` is
  # a string but its value is dynamic, so it is NOT a hardcoded secret. RE2 has
  # no lookahead, so excluding the backtick quote is how we keep templates out
  # without a "contains ${" negative test.
  #
  # $NAME deliberately omits bare "auth" (it would match authorName); it uses the
  # compound auth_token/authtoken forms instead.
  #
  # `let` is DECLARED here, not inherited. It used to be reached by accident: the
  # matcher could not see the declaration keyword (it is not a named child), so
  # every lexical_declaration looked alike and "const $NAME = $VALUE" caught
  # `let` for exactly the reason "$DB.query($A + $B)" caught a modulo. Now that
  # the matcher compares node skeletons, a shape this rule detects has to be
  # written down — which is the honest state anyway: a hardcoded secret in a
  # `let` is a hardcoded secret. `var` stays out: it is a different node type
  # (variable_declaration), it never matched, and the shape census records it as
  # a known gap.
  - id: SEC-001
    message: "Hardcoded secret in a credential-named variable"
    suggestion: "Move the value to an environment variable or a secrets manager; never commit it"
    severity: high
    dimension: security
    pattern-either:
      - "const $NAME = $VALUE"
      - "let $NAME = $VALUE"
      # The object shape, reached through the scoped ellipsis (`...$REST`). The
      # ellipsis is ZERO-or-more, so this single alternative covers both
      # `{apiKey: "x"}` and a credential buried in a five-property config object
      # — no separate single-pair alternative is needed. The census that forced
      # this: across two real TypeScript projects, every object holding a
      # credential-named string property had arity 5, 5, 5 and 3. Four of four
      # multi-property, none at arity 1, so the exact-arity pattern this rule
      # could have carried would have reached exactly nothing.
      #
      # `...$REST` and not Semgrep's `...`: a bare ellipsis inside an object does
      # not parse in TypeScript, so the compile gate rejects it. Measured, not
      # chosen. See [objectsubset] in internal/core/ruleengine/matcher.go.
      - "({...$REST, $NAME: $VALUE})"
      # `var` is a variable_declaration, a DIFFERENT node type from the
      # lexical_declaration that carries const/let, so it needs its own
      # alternative and no amount of widening the others reaches it. Rare in
      # modern TypeScript (the censused project held 7 let/var string
      # assignments in total) — named for completeness, not urgency.
      - "var $NAME = $VALUE"
      # A type annotation adds a child to the declarator, so the untyped pattern
      # stops matching. Prevalence UNMEASURED: the censused projects held zero,
      # which is a fact about those projects and not a claim about the shape.
      - "const $NAME: $T = $VALUE"
      - "let $NAME: $T = $VALUE"
    metavariable-regex:
      $NAME: "(?i)(passwd|password|pwd|secret|apikey|api_key|accesskey|access_key|privatekey|private_key|access_token|accesstoken|auth_token|authtoken|client_secret|clientsecret|credential|token)"
      $VALUE: "^[\"'].+[\"']$"
