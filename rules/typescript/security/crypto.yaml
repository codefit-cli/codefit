rules:
  # Direct weak-hash function calls (the `md5` / `js-sha1` npm packages and the
  # like). md5($X) matches md5(anything) — the metavariable generalises the
  # argument, and the hash is weak regardless of what is hashed (ADR 0004).
  - id: SEC-052
    message: "Weak hash algorithm (MD5/SHA-1)"
    suggestion: "Use SHA-256 or stronger for integrity; bcrypt/argon2/scrypt for passwords"
    severity: medium
    dimension: security
    pattern-either:
      - "md5($X)"
      - "sha1($X)"

  # Node's crypto.createHash with a weak algorithm. Both the destructured form
  # (createHash("md5")) and the member form (crypto.createHash("md5")) are
  # covered; metavariable-regex on $ALG accepts either quote style and any case
  # (Node treats algorithm names case-insensitively).
  - id: SEC-053
    message: "Weak hash algorithm passed to createHash (MD5/SHA-1)"
    suggestion: "Pass 'sha256' or stronger; for passwords use bcrypt/argon2/scrypt instead of a raw hash"
    severity: medium
    dimension: security
    pattern-either:
      - "createHash($ALG)"
      - "$C.createHash($ALG)"
    metavariable-regex:
      $ALG: "(?i)^[\"'`](md5|sha1)[\"'`]$"

  # Math.random() is not cryptographically secure. We fire only when the value
  # is assigned to a security-named variable — the name, present in the same
  # declarator subtree, is the local signal that the value is security-sensitive
  # (ADR 0004). The two alternatives cover the bare call and the common
  # .toString(radix) form; both bind $T so the name regex applies to either.
  - id: SEC-058
    message: "Math.random() used for a security value (token/nonce/salt)"
    suggestion: "Use crypto.randomBytes / crypto.randomUUID / webcrypto getRandomValues for security values"
    severity: high
    dimension: security
    pattern-either:
      - "const $T = Math.random()"
      - "const $T = Math.random().toString($R)"
    metavariable-regex:
      $T: "(?i)(token|secret|nonce|salt|^iv$|session|apikey|api_key|otp|password|csrf|seed)"
